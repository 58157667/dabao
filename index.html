<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>预约</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>***预约</h1>
    <form id="bookingForm">
        名前
        <input
                type="text"
                id="name"
                placeholder="必須"
                required
        >

        電子メール
        <input
                type="email"
                id="email"
                placeholder="任意"
        >

        電話番号
        <!-- 增加正则：只允许半角数字 -->
        <input
                type="text"
                id="phone"
                placeholder="必須、半角数字のみ"
                required
                pattern="^[0-9]+$"
                title="電話番号は半角数字のみ入力してください"
        >

        予約年月日
        <input
                type="date"
                id="date"
                required
        >

        予約時間
        <select id="time" required>
            <option value="">選択してください</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
            <option>18:00</option>
            <option>19:00</option>
        </select>

        サービス
        <select id="service" required>
            <option value="">選択してください</option>
            <option>かっさ 20分/1800円</option>
            <option>吸い玉(伝統火罐十スライドカッピング) 20分/3000円</option>
            <option>手技による伝統懸灸(肩·首·腰·背中) 60分/7000円</option>
            <option>手技による伝統懸灸(肩·首·腰·背中) 十 吸い玉 75分/9000円</option>
            <option>手技による伝統懸灸(肩·首·腰·背中) 十 かっさ 70分/8000円</option>
        </select>

        <button type="submit">提出</button>
        <div id="message"></div>
    </form>
</div>

<script src="app.js"></script>
<script>
// 页面加载时设置date最小值为今日
window.onload = function () {
    const today = new Date();
    const y = today.getFullYear();
    let m = today.getMonth() + 1;
    let d = today.getDate();
    if (m < 10) m = '0' + m;
    if (d < 10) d = '0' + d;
    const minDay = `${y}-${m}-${d}`;
    document.getElementById('date').min = minDay;
}

// 表单提交校验手机号纯数字
const form = document.getElementById('bookingForm');
const msgBox = document.getElementById('message');
form.addEventListener('submit', function(e) {
    const phoneVal = document.getElementById('phone').value.trim();
    // 正则判断是否全部为半角数字
    const numReg = /^[0-9]+$/;
    if (!numReg.test(phoneVal)) {
        e.preventDefault(); // 阻止提交
        msgBox.style.color = 'red';
        msgBox.textContent = 'エラー：電話番号は半角数字だけで入力してください';
        return;
    }
    // 校验通过清空提示
    msgBox.textContent = '';
    msgBox.style.color = '';
    // 这里可以写提交逻辑，如ajax请求
});
</script>
</body>
</html>
