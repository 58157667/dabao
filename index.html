<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>预约</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>***预约</h1>

    <form id="bookingForm">
        姓名
        <input
                type="text"
                id="name"
                placeholder="必填"
                required
        >

        电子邮箱
        <input
                type="email"
                id="email"
                placeholder="选填"
        >

        手机号码
        <input
                type="tel"
                id="phone"
                placeholder="必填，仅限数字"
                required
        >

        预约日期
        <input
                type="date"
                id="date"
                required
        >

        预约时间
        <select id="time" required>
            <option value="">请选择</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
            <option>18:00</option>
            <option>19:00</option>
        </select>

        服务项目
        <select id="service" required>
            <option value="">请选择</option>
            <option>刮痧 20分钟 / 1800日元</option>
            <option>拔罐（传统火罐+走罐）20分钟 / 3000日元</option>
            <option>传统悬灸（肩、颈、腰、背）60分钟 / 7000日元</option>
            <option>传统悬灸（肩、颈、腰、背）+ 拔罐 75分钟 / 9000日元</option>
            <option>传统悬灸（肩、颈、腰、背）+ 刮痧 70分钟 / 8000日元</option>
        </select>

        <button type="submit">提交预约</button>
        <div id="message"></div>
    </form>
</div>

<script src="app.js"></script>

<script>
    // 手机号仅允许输入数字
    const phone = document.getElementById("phone");

    phone.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "");
    });

    // 页面加载时设置日期最小值为今天
    window.onload = function () {
        const today = new Date();
        const y = today.getFullYear();
        let m = today.getMonth() + 1;
        let d = today.getDate();

        if (m < 10) m = '0' + m;
        if (d < 10) d = '0' + d;

        const minDay = `${y}-${m}-${d}`;
        document.getElementById('date').min = minDay;
    }
</script>
</body>
</html>
