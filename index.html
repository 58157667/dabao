<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>预约</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>***预约</h1>
    <form id="bookingForm">
        名前
        <input
                type="text"
                id="name"
                placeholder="必須"
                required
        >

        電子メール
        <input
                type="email"
                id="email"
                placeholder="任意"
        >

        電話番号
        <input
                type="text"
                id="phone"
                placeholder="必須、半角数字のみ"
                required
                pattern="^[0-9]+$"
                title="電話番号は半角数字のみ入力してください"
        >

        予約年月日
        <input
                type="date"
                id="date"
                required
        >

        予約時間
        <select id="time" required>
            <option value="">選択してください</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
            <option>18:00</option>
            <option>19:00</option>
        </select>

        サービス
        <select id="service" required>
            <option value="">選択してください</option>
            <option>かっさ 20分/1800円</option>
            <option>吸い玉(伝統火罐十スライドカッピング) 20分/3000円</option>
            <option>手技による伝統懸灸(肩·首·腰·背中) 60分/7000円</option>
            <option>手技による伝統懸灸(肩·首·腰·背中) 十 吸い玉 75分/9000円</option>
            <option>手技による伝統懸灸(肩·首·腰·背中) 十 かっさ 70分/8000円</option>
        </select>

        <button type="submit">提出</button>
        <div id="message"></div>
    </form>
</div>

<script src="app.js"></script>
<script>
// 予約年月日を今日以降のみに制限
function setMinDate() {
    const today = new Date();
    const year = today.getFullYear();
    let month = today.getMonth() + 1;
    let day = today.getDate();

    // 月日2桁に整形
    month = month < 10 ? '0' + month : month;
    day = day < 10 ? '0' + day : day;

    const minDateStr = `${year}-${month}-${day}`;
    document.getElementById('date').min = minDateStr;
}

window.onload = setMinDate;

// フォーム送信時チェック
const form = document.getElementById('bookingForm');
const msgBox = document.getElementById('message');
form.addEventListener('submit', function(e) {
    msgBox.textContent = '';
    msgBox.style.color = '';

    // 電話番号半角数字チェック
    const phoneVal = document.getElementById('phone').value.trim();
    const numReg = /^[0-9]+$/;
    if (!numReg.test(phoneVal)) {
        e.preventDefault();
        msgBox.style.color = 'red';
        msgBox.textContent = 'エラー：電話番号は半角数字だけで入力してください';
        return;
    }

    // 追加：JS側で日付再チェック（ブラウザ改ざん防止）
    const selectDate = new Date(document.getElementById('date').value);
    const now = new Date();
    // 時分秒を0にして日付比較
    selectDate.setHours(0,0,0,0);
    now.setHours(0,0,0,0);
    if (selectDate < now) {
        e.preventDefault();
        msgBox.style.color = 'red';
        msgBox.textContent = 'エラー：今日以降の日付を選択してください';
        return;
    }
});
</script>
</body>
</html>
